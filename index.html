.verify{position:absolute;bottom:6px;right:2px;background:#3b82f6;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:3px solid #111827;font-weight:bold}

.join{
margin-top:24px;
display:flex;
align-items:center;
justify-content:center;
gap:12px;
text-decoration:none;
color:#fff;
font-size:21px;
font-weight:800;
height:72px;
border-radius:22px;
background:linear-gradient(90deg,#7c3aed,#2563eb);
box-shadow:0 0 18px rgba(124,58,237,.55),0 0 36px rgba(37,99,235,.35);
animation:pulse 1.8s infinite;
position:relative;
overflow:hidden;
}
.join:before{
content:"";
position:absolute;
top:0;left:-120%;
width:60%;height:100%;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
transform:skewX(-25deg);
animation:shine 3s infinite;
}
@keyframes shine{100%{left:160%}}

0%,100%{transform:scale(1)}
50%{transform:scale(1.03)}
}
.small{margin-top:12px;color:#b9c0d4;font-size:13px}

<script>
let s=30;
const n=document.getElementById('num');
const r=document.getElementById('ring');
setInterval(()=>{
n.textContent=s;
r.style.setProperty('--p',((30-s)/30)*360+'deg');
s=s<=0?30:s-1;
},1000);

/* CTA protection: reduce accidental, repeated and obvious automated clicks */
(function () {
  const btn = document.getElementById('joinBtn');
  if (!btn) return;

  let humanInteraction = false;
  let lastClickAt = 0;
  const COOLDOWN_MS = 8000;
  const MIN_DWELL_MS = 1200;
  const pageOpenedAt = Date.now();
  const STORAGE_KEY = 'same_official_subscribe_sent';

  function markHumanInteraction() {
    humanInteraction = true;
  }

  /* Works for mouse, touch and keyboard users */
  ['pointerdown', 'touchstart', 'keydown'].forEach(function (evt) {
    window.addEventListener(evt, markHumanInteraction, { passive: true });
  });

  btn.addEventListener('click', function (e) {
    const now = Date.now();

    /* Ignore synthetic/untrusted browser events */
    if (e.isTrusted === false) {
      e.preventDefault();
      return;
    }

    /* Require a little real page interaction before counting CTA */
    if (!humanInteraction || (now - pageOpenedAt) < MIN_DWELL_MS) {
      e.preventDefault();
      return;
    }

    /* Prevent rapid repeated clicks */
    if (now - lastClickAt < COOLDOWN_MS) {
      e.preventDefault();
      return;
    }

    /* One Subscribe event per browser session */
    try {
      if (sessionStorage.getItem(STORAGE_KEY) === '1') {
        return;
      }
    } catch (_) {}

    lastClickAt = now;

    if (typeof fbq === 'function') {
      fbq('track', 'Subscribe');
    }

    try {
      sessionStorage.setItem(STORAGE_KEY, '1');
    } catch (_) {}

    /* Give the Meta event a moment to enter the queue before navigation */
    e.preventDefault();
    const destination = btn.href;
    setTimeout(function () {
      window.location.href = destination;
    }, 250);
  });
})();
</script>
